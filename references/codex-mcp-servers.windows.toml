# Windows launch forms for the shared local MCP servers.
# User-relative paths are expanded by cmd.exe on the target machine.

[mcp_servers.code-index]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'call "%USERPROFILE%\.local\bin\code-index-mcp.exe"']
enabled = true
startup_timeout_sec = 60.0

[mcp_servers.context7]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'call "%APPDATA%\npm\context7-mcp.cmd" --api-key "%CONTEXT7_API_KEY%"']
enabled = true
startup_timeout_sec = 60.0

[mcp_servers.deepwiki]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'call "%USERPROFILE%\.local\bin\mcp-proxy.exe" https://mcp.deepwiki.com/mcp --transport=streamablehttp']
enabled = true
startup_timeout_sec = 60.0

[mcp_servers.memory]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'call "%APPDATA%\npm\mcp-server-memory.cmd"']
enabled = false
startup_timeout_sec = 60.0

[mcp_servers.playwright]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'call "%APPDATA%\npm\playwright-mcp.cmd" --extension']
enabled = false
startup_timeout_sec = 60.0

[mcp_servers.sequential-thinking]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'call "%APPDATA%\npm\mcp-server-sequential-thinking.cmd"']
enabled = false
startup_timeout_sec = 60.0

[mcp_servers.serena]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'call "%USERPROFILE%\.local\bin\serena.exe" start-mcp-server --context codex --enable-web-dashboard False']
enabled = true
startup_timeout_sec = 60.0

[mcp_servers.shrimp-task-manager]
command = "cmd.exe"
args = ["/d", "/s", "/c", 'set "DATA_DIR=.shrimp" && set "ENABLE_GUI=false" && set "TEMPLATES_USE=zh" && call "%APPDATA%\npm\mcp-shrimp-task-manager.cmd"']
enabled = false
startup_timeout_sec = 60.0
